<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avrupa Kurumsal Bülten</title>

<!-- Telefonda ana ekrana eklenince uygulama gibi acilsin -->
<meta name="theme-color" content="#12233f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AK Bülten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<!-- Acilis kapagi. HTML'in icinde duruyor ki JS beklemeden aninda gorunsun;
     veri cozulup uygulama hazir olunca yumusak gecisle kayboluyor. -->
<div class="kapak" id="kapak">
  <svg class="kapak-fon" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="cam" width="24" height="21" patternUnits="userSpaceOnUse">
        <rect width="24" height="21" fill="#15294a"/>
        <rect x="3" y="3" width="15" height="13" fill="#22406d"/>
      </pattern>
      <linearGradient id="erime" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#12233f" stop-opacity="1"/>
        <stop offset="0.45" stop-color="#12233f" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#12233f" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <g>
      <rect x="60" y="330" width="112" height="190" fill="url(#cam)"/>
      <rect x="700" y="286" width="120" height="234" fill="url(#cam)"/>
      <rect x="836" y="352" width="96" height="168" fill="url(#cam)"/>
      <rect x="950" y="312" width="150" height="208" fill="url(#cam)"/>
      <rect x="1112" y="392" width="88" height="128" fill="url(#cam)"/>
      <rect x="0" y="418" width="52" height="102" fill="url(#cam)"/>

      <polygon points="196,232 316,196 316,520 196,520" fill="url(#cam)"/>
      <polygon points="348,118 490,74 490,520 348,520" fill="url(#cam)"/>
      <polygon points="524,178 652,142 652,520 524,520" fill="url(#cam)"/>

      <rect x="196" y="228" width="120" height="5" fill="#3d6ba8"/>
      <rect x="348" y="112" width="142" height="5" fill="#4d80c4"/>
      <rect x="524" y="174" width="128" height="5" fill="#3d6ba8"/>
      <rect x="416" y="52" width="4" height="60" fill="#4d80c4"/>
    </g>

    <rect x="0" y="0" width="1200" height="520" fill="url(#erime)"/>
  </svg>

  <div class="kapak-ic">
    <div class="kapak-cizgi"></div>
    <div class="kapak-ad">Avrupa Kurumsal</div>
    <div class="kapak-alt">Bülten</div>
  </div>
</div>

<header class="ust">
  <div class="ust-sol">
    <div class="logo">AK</div>
    <div>
      <h1>Avrupa Kurumsal Bülten</h1>
      <div class="ust-alt" id="ustOzet">Veri yükleniyor…</div>
    </div>
  </div>
  <div class="ust-sag">
    <div class="arama-kutu">
      <input type="search" id="arama" placeholder="Haberlerde ara… (başlık, kaynak, firma)" autocomplete="off">
    </div>
    <button class="dugme" id="btnYenile" title="Veri dosyasını yeniden oku">Yenile</button>
    <button class="dugme sade" id="btnTema" title="Açık / koyu tema">Tema</button>
  </div>
</header>

<div class="govde">

  <aside class="yan">
    <div class="yan-baslik">Görünüm</div>
    <nav id="hizliMenu" class="menu"></nav>

    <div class="yan-baslik">Konular</div>
    <nav id="grupMenu" class="menu"></nav>

    <div class="yan-baslik">Müşteriler <span class="yan-not" id="firmaGrupAdi"></span></div>
    <div class="firma-kutu">
      <input type="search" id="firmaArama" placeholder="Müşteri ara…" autocomplete="off">
      <nav id="firmaMenu" class="menu firma-menu"></nav>
    </div>
  </aside>

  <main class="ana">
    <div class="arac-cubugu">
      <div class="arac-sol">
        <button class="dugme sade kucuk yalniz-mobil" id="btnFiltre">Konular ve filtreler</button>
        <label>Tarih
          <select id="tarihSecim">
            <option value="0">1 Ağustos'tan bu yana</option>
            <option value="1">Bugün</option>
            <option value="2">Son 2 gün</option>
            <option value="7">Son 7 gün</option>
            <option value="30">Son 30 gün</option>
          </select>
        </label>
        <label>Sırala
          <select id="siraSecim">
            <option value="yeni">Önce en yeni</option>
            <option value="eski">Önce en eski</option>
            <option value="kaynak">Kaynağa göre</option>
          </select>
        </label>
        <label class="onay"><input type="checkbox" id="sadeceOkunmamis"> Sadece okunmamış</label>
        <label class="onay" title="Hiçbir konuya girmeyen haberler varsayılan olarak gizlidir"><input type="checkbox" id="sinifsizGoster"> Sınıflandırılmamışları da göster</label>
      </div>
      <div class="arac-sag">
        <button class="dugme sade kucuk" id="btnHepsiOkundu">Tümünü okundu say</button>
        <button class="dugme sade kucuk" id="btnDisaAktar">CSV indir</button>
      </div>
    </div>

    <div id="zamanSerisi" class="zaman-serisi"></div>

    <div id="filtreOzet" class="filtre-ozet"></div>
    <div id="liste" class="liste"></div>
    <div id="dahaFazlaSarma" class="daha-fazla-sarma"></div>
  </main>

</div>

<script src="data/haberler.js" charset="utf-8"></script>
<script src="js/app.js?v=5" charset="utf-8"></script>
</body>
</html>
