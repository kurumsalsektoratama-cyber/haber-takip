<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avrupa Kurumsal Bülten</title>

<!-- Telefonda ana ekrana eklenince uygulama gibi acilsin -->
<meta name="theme-color" content="#00674A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AK Bülten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<!-- Acilis kapagi. HTML'in icinde duruyor ki JS beklemeden aninda gorunsun. -->
<div class="kapak" id="kapak">
  <svg class="kapak-fon" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="cam" width="24" height="21" patternUnits="userSpaceOnUse">
        <rect width="24" height="21" fill="#0A4033"/>
        <rect x="3" y="3" width="15" height="13" fill="#14614A"/>
      </pattern>
      <linearGradient id="erime" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#043026" stop-opacity="1"/>
        <stop offset="0.45" stop-color="#043026" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#043026" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g>
      <rect x="60" y="330" width="112" height="190" fill="url(#cam)"/>
      <rect x="700" y="286" width="120" height="234" fill="url(#cam)"/>
      <rect x="836" y="352" width="96" height="168" fill="url(#cam)"/>
      <rect x="950" y="312" width="150" height="208" fill="url(#cam)"/>
      <rect x="1112" y="392" width="88" height="128" fill="url(#cam)"/>
      <rect x="0" y="418" width="52" height="102" fill="url(#cam)"/>
      <polygon points="196,232 316,196 316,520 196,520" fill="url(#cam)"/>
      <polygon points="348,118 490,74 490,520 348,520" fill="url(#cam)"/>
      <polygon points="524,178 652,142 652,520 524,520" fill="url(#cam)"/>
      <rect x="196" y="228" width="120" height="5" fill="#2F9070"/>
      <rect x="348" y="112" width="142" height="5" fill="#4CB78E"/>
      <rect x="524" y="174" width="128" height="5" fill="#2F9070"/>
      <rect x="416" y="52" width="4" height="60" fill="#4CB78E"/>
    </g>
    <rect x="0" y="0" width="1200" height="520" fill="url(#erime)"/>
  </svg>

  <div class="kapak-ic">
    <div class="kapak-marka">AK</div>
    <div class="kapak-ad">Avrupa Kurumsal</div>
    <div class="kapak-alt">Bülten</div>
    <div class="kapak-cizgi"></div>
  </div>
</div>

<header class="ust" id="ust">
  <div class="ust-sira">
    <div class="ust-sol">
      <div class="logo">AK</div>
      <div class="ust-yazi">
        <h1>Avrupa Kurumsal Bülten</h1>
        <div class="ust-alt" id="ustOzet">Yükleniyor…</div>
      </div>
    </div>
    <div class="ust-sag">
      <button class="yuvarlak-dugme" id="btnAra" title="Ara" aria-label="Ara">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <button class="yuvarlak-dugme" id="btnYenile" title="Yenile" aria-label="Yenile">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="yuvarlak-dugme" id="btnTema" title="Tema" aria-label="Tema">
        <svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </div>

  <div class="arama-satiri" id="aramaSatiri">
    <input type="search" id="arama" placeholder="Haber, kaynak veya müşteri ara…" autocomplete="off">
    <button class="yazi-dugme" id="btnAramaKapat">Vazgeç</button>
  </div>

  <!-- Konu seridi: acilir liste yerine yatay kaydirilan etiketler -->
  <nav class="serit" id="konuSerit" aria-label="Konular"></nav>
</header>

<div class="govde">

  <aside class="yan" id="yanPanel">
    <div class="yan-basi">
      <span>Filtreler</span>
      <button class="yuvarlak-dugme kucuk yalniz-mobil" id="btnPanelKapat" aria-label="Kapat">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="yan-icerik">
      <div class="yan-baslik">Görünüm</div>
      <nav id="hizliMenu" class="menu"></nav>

      <div class="yan-baslik">Zaman aralığı</div>
      <div class="secim-serit" id="tarihSerit"></div>

      <div class="yan-baslik">Sıralama</div>
      <div class="secim-serit" id="siraSerit"></div>

      <div class="yan-baslik">Seçenekler</div>
      <div class="anahtar-liste">
        <label class="anahtar">
          <span>Sadece okunmamış</span>
          <input type="checkbox" id="sadeceOkunmamis"><i></i>
        </label>
        <label class="anahtar">
          <span>Sınıflandırılmamışlar</span>
          <input type="checkbox" id="sinifsizGoster"><i></i>
        </label>
      </div>

      <div class="yan-baslik">Konular</div>
      <nav id="grupMenu" class="menu"></nav>

      <div class="yan-baslik">Müşteriler <span class="yan-not" id="firmaGrupAdi"></span></div>
      <div class="firma-kutu">
        <input type="search" id="firmaArama" placeholder="Müşteri ara…" autocomplete="off">
        <nav id="firmaMenu" class="menu firma-menu"></nav>
      </div>

      <div class="yan-baslik">Günlük yoğunluk</div>
      <div id="zamanSerisi" class="zaman-serisi"></div>

      <div class="yan-islem">
        <button class="dugme sade" id="btnHepsiOkundu">Tümünü okundu say</button>
        <button class="dugme sade" id="btnDisaAktar">CSV indir</button>
      </div>
    </div>
  </aside>

  <main class="ana">
    <div id="filtreOzet" class="filtre-ozet"></div>
    <div id="liste" class="liste"></div>
    <div id="dahaFazlaSarma" class="daha-fazla-sarma"></div>
  </main>

</div>

<div class="panel-perde" id="panelPerde"></div>

<!-- Telefonda alt sekme cubugu: uygulama hissini veren asil unsur -->
<nav class="alt-nav" id="altNav" aria-label="Bölümler">
  <button data-gorunum="tumu" class="aktif">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Akış</span>
  </button>
  <button data-gorunum="okunmamis">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    <span>Okunmamış</span>
    <em class="nav-sayi" id="navOkunmamis"></em>
  </button>
  <button data-gorunum="kayitli">
    <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
    <span>Kayıtlı</span>
  </button>
  <button data-rol="filtre">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    <span>Filtre</span>
  </button>
</nav>

<button class="yukari" id="btnYukari" aria-label="Başa dön">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>

<script src="data/haberler.js" charset="utf-8"></script>
<script src="js/app.js?v=8" charset="utf-8"></script>
</body>
</html>
